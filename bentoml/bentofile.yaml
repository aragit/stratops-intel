service: "services.extraction:ExtractionService"
labels:
  owner: stratops-intel
  project: competitive-intelligence
  version: "0.1.0"

include:
  - "services/*.py"
  - "models/**"

python:
  packages:
    - torch>=2.4.0
    - transformers>=4.44.0
    - accelerate>=0.33.0
    - pydantic>=2.9.0
    - bentoml>=1.3.0
    - vllm>=0.6.0
    - autoawq>=0.2.0
    - structlog>=24.1.0

docker:
  cuda_version: "12.1"
  base_image: "nvidia/cuda:12.1-runtime-ubuntu22.04"
  system_packages:
    - ffmpeg
    - libglib2.0-0
    - libsm6
    - libxext6
    - libxrender-dev
    - libgl1-mesa-glx
  python_version: "3.11"
  distro: "ubuntu22.04"
  setup_script: |
    pip install --no-cache-dir --upgrade pip
    pip install --no-cache-dir vllm==0.6.0 --extra-index-url https://download.pytorch.org/whl/cu121

traffic:
  timeout: 30
  concurrency: 16

resources:
  gpu: 1
  memory: "24Gi"

batching:
  max_batch_size: 32
  max_latency_ms: 50
  batch_dim: 0