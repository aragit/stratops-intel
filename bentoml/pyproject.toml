[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stratops-intel-bentoml"
version = "0.1.0"
description = "BentoML inference services for StratOps Intel"
requires-python = ">=3.11"

[project.dependencies]
bentoml = ">=1.3.0"
vllm = ">=0.4.0"
pydantic = ">=2.9.0"
structlog = ">=24.1.0"
pyyaml = ">=6.0.1"