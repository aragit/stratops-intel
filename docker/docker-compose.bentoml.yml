version: "3.9"

services:
  bentoml-extraction:
    build:
      context: ./bentoml
      dockerfile: Dockerfile
    container_name: stratops-bentoml-extraction
    ports:
      - "3001:3000"
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - EXTRACTION_MODEL=Qwen/Qwen2.5-7B-Instruct-AWQ
      - BENTOML_HOME=/home/bentoml
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    networks:
      - stratops-network

networks:
  stratops-network:
    external: true
    name: stratops-network