version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: stratops-postgres
    environment:
      POSTGRES_DB: stratops
      POSTGRES_USER: stratops
      POSTGRES_PASSWORD: stratops_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stratops -d stratops"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - stratops-network
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: stratops-neo4j
    environment:
      - NEO4J_AUTH=
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2g
      - NEO4J_dbms_memory_pagecache_size=512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neodata:/data
      - neodata_logs:/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stratops-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: stratops-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - stratops-network
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: stratops-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: stratops
      MINIO_ROOT_PASSWORD: stratops_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stratops-network
    restart: unless-stopped

volumes:
  pgdata:
  neodata:
  neodata_logs:
  redisdata:
  miniodata:

networks:
  stratops-network:
    driver: bridge